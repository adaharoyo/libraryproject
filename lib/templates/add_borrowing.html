<!DOCTYPE html>
<html lang="en">
    {% load static %}
    {% load crispy_forms_tags %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borrowing Form</title>
    <link rel ="stylesheet"  href="{% static 'css/bootstrap.min.css'%}">
</head>
<body>
    <h1> Get any books</h1>
    <div class = "container">
        <form method="POST">
            {% csrf_token%}
            {{form|crispy}}
            <input type="submit" class="btn btn-success">
            
        </form>

        {% if msg %}
            {{msg}}
        {% endif %}


    </div>
  <a href="{% url 'index_page' %}">Go to Index Page</a>

</body>
</html>
